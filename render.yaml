services:
  - type: web
    name: campusguard
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: QR_SECRET
        sync: false
      - key: QR_TTL_SECONDS
        value: 20
      - key: NEXT_PUBLIC_APP_URL
        sync: false
