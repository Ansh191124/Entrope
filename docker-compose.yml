services:
  postgres:
    image: postgres:16-alpine
    container_name: campusguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusguard
      POSTGRES_PASSWORD: campusguard
      POSTGRES_MULTIPLE_DATABASES: campusguard,campusguard_test
    ports:
      - "5432:5432"
    volumes:
      - campusguard-postgres-data:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusguard-postgres-data:
